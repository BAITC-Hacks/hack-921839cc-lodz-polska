name: Backend checks
on:
  push:
    branches: [main, feature/simulation]
    paths: ['backend/**', 'shared/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'shared/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend/app/api/simulation backend/app/models backend/app/simulation backend/app/main.py backend/tests backend/scripts
      - run: python -m ruff format --check backend/app/api/simulation backend/app/models backend/app/simulation backend/app/main.py backend/tests backend/scripts
      - run: python -m pytest --cov=app --cov-report=term-missing
        working-directory: backend
      - run: python backend/scripts/export_fixtures.py
      - run: git diff --exit-code -- shared/fixtures shared/openapi.json
